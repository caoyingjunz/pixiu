# PR 自动打标签规则（配合 .github/workflows/pr-labeler.yml）
# 基于改动文件路径给 PR 打模块标签
area/api:
  - changed-files:
      - any-glob-to-any-file: api/**

area/db:
  - changed-files:
      - any-glob-to-any-file: pkg/db/**

area/controller:
  - changed-files:
      - any-glob-to-any-file: pkg/controller/**

area/runtime:
  - changed-files:
      - any-glob-to-any-file: pkg/util/runtime/**

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Makefile
          - docker/**

documentation:
  - changed-files:
      - any-glob-to-any-file: docs/**
