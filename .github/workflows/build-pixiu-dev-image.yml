name: Publish pixiu-dev-server image

on:
  # 允许手动/API 触发：合并 pixiu-ui 的 PR 后由 skill 通过 workflow_dispatch 重建 dev 镜像
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths-ignore:
      - 'docs/**'
      - 'cmd/cluster-agent/**'
      - 'docker/Dockerfile-cluster-agent'
      - 'docker/Dockerfile-toolbox'
      - 'deploy/agent/**'
      - '.github/workflows/build-cluster-agent-image.yml'
      - '.github/workflows/build-toolbox-image.yml'
      - '.github/workflows/build-cluster-agent-dev-image.yml'
      - '.github/workflows/build-deploy-agent-dev-image.yml'
      - 'cmd/upgrade/**'
      - 'docker/Dockerfile-upgrade'
      - '.github/workflows/build-upgrade-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout pixiu-ui
        uses: actions/checkout@v3
        with:
          repository: pixiu-io/pixiu-ui
          ref: master
          # GITHUB_TOKEN 无法访问其他私有仓库，需配置有 pixiu-ui 读权限的 PAT
          token: ${{ secrets.PIXIU_UI_TOKEN }}
          path: pixiu-ui

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      # amd64 走 runner 原生；arm64 需要 QEMU 模拟
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the amd64 pixiu image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.COMMIT_HASH }}-${{ env.TIMESTAMP }}
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:latest

      # arm64 单架构镜像，单独打 latest-arm64 标签；不影响上面的 amd64 latest 构建
      - name: Build and push the arm64 pixiu dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ env.COMMIT_HASH }}-${{ env.TIMESTAMP }}
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:latest-arm64
