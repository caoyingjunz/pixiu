name: Publish pixiu-deploy-agent image

on:
  push:
    branches:
      - "master"
    paths:
      # 发布 PR 只改 VERSION，需触发所有发布镜像重建，否则版本记录会指向不存在的镜像
      - 'VERSION'
      - 'cmd/deploy-agent/**'
      - 'docker/Dockerfile-deploy-agent'
      - 'deploy/agent/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-deploy-agent-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          # 镜像 tag 统一取 VERSION 文件（发布 PR 只改这一个文件），避免各 workflow 各写一份版本号后漂移
          echo "VERSION_TAG=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the pixiu-deploy-agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-deploy-agent
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.COMMIT_HASH }}-${{ env.TIMESTAMP }}
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-deploy-agent:latest
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-deploy-agent:${{ env.VERSION_TAG }}
        # crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-deploy-agent:${{ env.COMMIT_HASH }}
