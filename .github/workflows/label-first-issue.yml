name: Label First Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-first-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this is the author's first issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          COUNT=$(gh api "repos/$REPO/issues?creator=$AUTHOR&state=all&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "作者 $AUTHOR 历史 issue 数: $COUNT"

      - name: Label as good first issue
        if: steps.check.outputs.count == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "good first issue"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "感谢提交首个 issue！🎉 已自动打上 \`good first issue\` 标签，维护者会尽快跟进。"
