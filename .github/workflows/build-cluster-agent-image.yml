name: Publish pixiu-cluster-agent image

on:
  push:
    branches:
      - "master"
    paths:
      - 'cmd/cluster-agent/**'
      - 'pkg/tunnel/**'
      - 'docker/Dockerfile-cluster-agent'
      - 'deploy/agent/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-cluster-agent-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the cluster-agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-cluster-agent
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.COMMIT_HASH }}-${{ env.TIMESTAMP }}
          push: true
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/cluster-agent:latest
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/cluster-agent:v2.0.1-beta.4
        # crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/cluster-agent:${{ env.COMMIT_HASH }}
