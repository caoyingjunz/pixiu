name: Publish pixiu-server image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pixiu_ui_ref:
        description: '打包进镜像的 pixiu-ui ref（tag/branch/commit，默认 master）'
        required: false
        default: master
        type: string

env:
  IMAGE_VERSION: v2.0.2-beta.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout pixiu-ui
        uses: actions/checkout@v3
        with:
          repository: pixiu-io/pixiu-ui
          ref: ${{ github.event.inputs.pixiu_ui_ref || 'master' }}
          # GITHUB_TOKEN 无法访问其他私有仓库，需配置有 pixiu-ui 读权限的 PAT
          token: ${{ secrets.PIXIU_UI_TOKEN }}
          path: pixiu-ui

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check DefaultVersion matches image version
        run: |
          DEFAULT=$(sed -n 's/.*DefaultVersion = "\([^"]*\)".*/\1/p' pkg/controller/upgrade/upgrade.go | head -1)
          if [ -n "$DEFAULT" ] && [ "$DEFAULT" != "$IMAGE_VERSION" ]; then
            echo "::warning::DefaultVersion=$DEFAULT 与发布版本 $IMAGE_VERSION 不一致"
          fi

      - name: Build and push the multi-arch pixiu image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:${{ env.IMAGE_VERSION }}

