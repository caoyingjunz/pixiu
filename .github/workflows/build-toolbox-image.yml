name: Publish pixiu-toolbox image

on:
  push:
    branches:
      - "master"
    paths:
      - 'docker/Dockerfile-toolbox'
      - '.github/workflows/build-toolbox-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the pixiu-toolbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile-toolbox
          platforms: linux/amd64,linux/arm64
          build-args: |
            K8S_VERSION=v1.36.2
            HELM_VERSION=v3.7.1
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-toolbox:v2.0.1
