# 保留 Compose 文件版本字段，兼容仍使用旧版 docker-compose 的部署环境
version: "2.4"

services:
  mysql:
    image: ccr.ccs.tencentyun.com/pixiucloud/mysql:5.7
    container_name: mysql
    restart: always
#    ports:
#      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: "Pixiu868686"
      MYSQL_DATABASE: "pixiu"
    volumes:
      - ./mysql/data:/var/lib/mysql

  pixiu:
    image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:v2.0.2-beta.2
    container_name: pixiu
    restart: always
    ports:
      - 8080:80
    depends_on:
      - mysql
    volumes:
      - /etc/pixiu:/etc/pixiu
      - /var/run/docker.sock:/var/run/docker.sock

  # 自动升级执行进程：必须运行在 pixiu 容器之外，与 pixiu 共用同一份 /etc/pixiu 配置
  # 对应命令行：docker run -d --name pixiu-upgrade --restart=always --net host \
  #   -v /etc/pixiu:/etc/pixiu -v /var/run/docker.sock:/var/run/docker.sock pixiu-upgrade:latest
  # 以上独立 docker run 示例保留不变；Compose 部署使用默认网络，才能通过服务名 mysql 访问数据库
  pixiu-upgrade:
    image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-upgrade:latest
    container_name: pixiu-upgrade
    restart: always
    # 声明 MySQL 依赖，确保升级进程随 Compose 启动时先启动 mysql 容器
    depends_on:
      - mysql
    volumes:
      - /etc/pixiu:/etc/pixiu
      - /var/run/docker.sock:/var/run/docker.sock
