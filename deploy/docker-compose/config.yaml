default:
  # 自动创建指定模型的数据库表结构，不会更新已存在的数据库表
  auto_migrate: true

  # 超级管理初始化用户名和密码；不指定的情况下，默认为 admin/Pixiu123456!
  admin_user: admin
  admin_password: Pixiu123456!

# 宿主容器运行时配置（pixiu 调用本机运行时拉起部署 runner 容器）
# 注意：这是宿主运行时，与「被部署集群的 CRI」（部署计划里的运行时选择）不是一回事
# docker-compose 部署已挂载 /var/run/docker.sock，须显式配置 cri: docker（缺省值已改为 containerd）
runtime:
  # 运行时类型：docker / containerd，默认 containerd
  cri: docker
  # 宿主运行时 socket 路径，只支持裸路径（如 /var/run/docker.sock），不要写 unix:// 前缀
  # 留空即沿用 DOCKER_HOST/默认 socket（本形态已挂载 /var/run/docker.sock，通常无需配置）
  #socket: /var/run/docker.sock

# 数据库地址信息, 根据实际情况配置
mysql:
  host: mysql # 数据库的ip
  user: root
  password: Pixiu868686
  port: 3306
  name: pixiu
