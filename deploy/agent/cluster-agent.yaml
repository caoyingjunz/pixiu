apiVersion: v1
kind: Namespace
metadata:
  name: pixiu-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pixiu-cluster-agent
  namespace: pixiu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pixiu-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: pixiu-cluster-agent
    namespace: pixiu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixiu-cluster-agent
  namespace: pixiu-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixiu-cluster-agent
  template:
    metadata:
      labels:
        app: pixiu-cluster-agent
    spec:
      serviceAccountName: pixiu-cluster-agent
      containers:
        - name: agent
          image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-cluster-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PIXIU_SERVER
              value: "https://<pixiu-server>"
            - name: PIXIU_TOKEN
              value: "<agent-token>"
            # - name: PIXIU_INSECURE
            #   value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
