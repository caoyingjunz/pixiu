apiVersion: v1
kind: Namespace
metadata:
  name: pixiu-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pixiu-deploy-agent
  namespace: pixiu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixiu-deploy-agent
  namespace: pixiu-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixiu-deploy-agent
  template:
    metadata:
      labels:
        app: pixiu-deploy-agent
    spec:
      serviceAccountName: pixiu-deploy-agent
      containers:
        - name: agent
          image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu-deploy-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PIXIU_SERVER
              value: "https://<pixiu-server>"
            - name: PIXIU_DEPLOY_TOKEN
              value: "<deploy-agent-token>"
            - name: PIXIU_AGENT_WORKDIR
              value: /var/lib/pixiu-deploy-agent
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: work
              mountPath: /var/lib/pixiu-deploy-agent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: work
          hostPath:
            path: /var/lib/pixiu-deploy-agent
            type: DirectoryOrCreate
