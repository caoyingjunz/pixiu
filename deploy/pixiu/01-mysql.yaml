# 可选：快速启动 MySQL（对应 install.md 选择2）
# 生产环境请替换为外部高可用数据库，并同步修改 ConfigMap 中的 mysql 配置。
apiVersion: v1
kind: Secret
metadata:
  name: pixiu-mysql
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "Pixiu868686"
  MYSQL_DATABASE: "pixiu"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pixiu-mysql-data
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixiu-mysql
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixiu-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pixiu-mysql
        app.kubernetes.io/name: pixiu
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: ccr.ccs.tencentyun.com/pixiucloud/mysql:5.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pixiu-mysql
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: pixiu-mysql
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pixiu-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: pixiu-mysql
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  selector:
    app: pixiu-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
