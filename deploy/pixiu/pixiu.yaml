# Pixiu 部署清单（Namespace / ConfigMap / Pixiu）
# 安装前请先准备好 MySQL，并修改下方 ConfigMap 中的 mysql 配置。
# 安装：kubectl apply -f deploy/pixiu/pixiu.yaml
# 卸载：kubectl delete -f deploy/pixiu/pixiu.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
---
# 对应 install.md 中 /etc/pixiu/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pixiu-config
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: server
data:
  config.yaml: |
    default:
      # 自动创建指定模型的数据库表结构，不会更新已存在的数据库表
      auto_migrate: true
      # 超级管理初始化用户名和密码；不指定的情况下，默认为 admin/Pixiu123456!
      admin_user: admin
      admin_password: Pixiu123456!

    # 宿主容器运行时配置（pixiu 调用本机运行时拉起部署 runner 容器）
    # 注意：这是宿主运行时，与「被部署集群的 CRI」不是一回事
    runtime:
      # 运行时类型：docker / containerd，默认 containerd；本清单显式配置 docker
      cri: docker
      # 宿主运行时 socket 路径，只支持裸路径（如 /var/run/docker.sock），不要写 unix:// 前缀
      # 留空即沿用 DOCKER_HOST/默认 socket
      #socket: /var/run/docker.sock

    # 数据库地址信息，根据实际情况配置
    mysql:
      host: <mysql-host>
      user: root
      password: Pixiu868686
      port: 3306
      name: pixiu
---
# 对应 install.md「启动 pixiu 服务端」
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixiu
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixiu
  template:
    metadata:
      labels:
        app: pixiu
        app.kubernetes.io/name: pixiu
        app.kubernetes.io/component: server
    spec:
      # 说明：本清单未挂载宿主容器运行时 socket（docker.sock / containerd.sock），
      # 因此该形态不支持「本地执行模式」，即不支持由 pixiu 在本机拉起部署 runner 容器。
      # 需要本地执行时，请使用 Plan 的 agent 执行模式（由目标节点上的 deploy-agent 执行）；
      # 确需本地执行则自行在此挂载运行时 socket（containerd 形态为 /run/containerd/containerd.sock）
      # 并补足权限——注意挂载运行时 socket 等同于把节点控制权交给 Pod，请先评估安全影响。
      containers:
        - name: pixiu
          image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:v2.0.2-beta.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pixiu
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: pixiu-config
---
apiVersion: v1
kind: Service
metadata:
  name: pixiu
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: server
spec:
  type: NodePort
  selector:
    app: pixiu
  ports:
    - name: http
      port: 80
      targetPort: http
