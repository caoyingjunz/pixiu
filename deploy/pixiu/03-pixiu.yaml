# 对应 install.md「启动 pixiu 服务端」
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixiu
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixiu
  template:
    metadata:
      labels:
        app: pixiu
        app.kubernetes.io/name: pixiu
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: pixiu
          # 与 CI / install.md 一致；可按需改为 :latest
          image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:v2.0.1-beta.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pixiu
              readOnly: true
            # 对应 install.md 挂载 docker.sock（自建集群 / runner 需要时打开）
            # - name: docker-sock
            #   mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: pixiu-config
        # - name: docker-sock
        #   hostPath:
        #     path: /var/run/docker.sock
        #     type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: pixiu
  namespace: pixiu-system
  labels:
    app.kubernetes.io/name: pixiu
    app.kubernetes.io/component: server
spec:
  type: NodePort
  selector:
    app: pixiu
  ports:
    - name: http
      port: 80
      targetPort: http
      # 可按需固定；留空则由集群分配
      # nodePort: 30080
