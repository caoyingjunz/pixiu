# pixiu-deploy-agent 配置文件，优先级高于环境变量
#
# 使用方式:
#   deploy-agent -config=/etc/pixiu/agent.yaml
#
# 环境变量（PIXIU_SERVER / PIXIU_DEPLOY_TOKEN / PIXIU_AGENT_WORKDIR / PIXIU_RUNTIME_CRI）
# 在配置文件值为空时作为回退。

default:
  # Pixiu 服务端地址
  server: ""
  # Agent 鉴权 token
  token: ""
  # 本地工作目录
  work_dir: "/etc/pixiu"

  # 宿主容器运行时配置（Agent 在本机拉起部署 runner 容器）
  # 注意：这是宿主运行时，与「被部署集群的 CRI」不是一回事
  # 缺省 containerd，不配置即使用 containerd；仅当本机只有 docker 时才改为 cri: docker
  runtime:
    # 运行时类型：docker / containerd，默认 containerd
    # 也可用环境变量 PIXIU_RUNTIME_CRI 指定；socket、containerd.namespace 仅走配置文件
    cri: containerd
    # 宿主运行时 socket 路径，只支持裸路径（如 /run/containerd/containerd.sock），不要写 unix:// 前缀
    # 留空时：containerd 使用 /run/containerd/containerd.sock；docker 沿用 DOCKER_HOST/默认 socket
    #socket: /run/containerd/containerd.sock
    #containerd:            # cri: containerd 时的可选项，整段不写即用下列默认值
    #  # 命名空间，默认 default；禁止使用 k8s.io（kubelet 工作区，会被拒绝）
    #  namespace: default
